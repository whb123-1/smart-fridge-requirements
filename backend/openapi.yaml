openapi: 3.1.0
info:
  title: 鲜知智慧冰箱 API
  version: 1.1.0
  description: 鲜知智慧冰箱演示 API，包含账户生命周期、管理员、菜谱运维、库存、虚拟探头环境监测与站内通知契约。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/RateLimitedError' }
  /auth/refresh:
    post:
      security: []
      operationId: refreshSession
      description: 使用 HttpOnly `xianzhi_refresh` Cookie 轮换刷新会话。
      responses:
        '200': { $ref: '#/components/responses/SessionResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/logout:
    post:
      security: []
      operationId: logout
      responses:
        '200':
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyEnvelope' }
          description: 当前刷新会话已撤销且 Cookie 已清除。
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    patch:
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: 已更新的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /me/password:
    patch:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: 密码已修改，现有刷新会话已撤销。 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /onboarding:
    get:
      operationId: getOnboardingStatus
      responses:
        '200':
          description: 初始化状态、约束、默认目标及已创建冰箱摘要。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatusEnvelope' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /onboarding/initialize:
    post:
      operationId: initializeFridge
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitializeRequest' }
      responses:
        '200':
          description: 初始化完成；相同幂等键和请求返回相同响应。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FridgeEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /fridges:
    get:
      operationId: listFridges
      responses:
        '200':
          description: 当前用户拥有的冰箱与分区摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FridgeSummary' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /inventory/items:
    get:
      operationId: listInventoryItems
      parameters:
        - { in: query, name: fridgeId, schema: { type: string, format: uuid } }
        - { in: query, name: zoneId, schema: { type: string, format: uuid } }
        - { in: query, name: category, schema: { $ref: '#/components/schemas/FoodCategory' } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      operationId: createInventoryItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateItemRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /inventory/transactions:
    get:
      operationId: listInventoryTransactions
      parameters:
        - { in: query, name: fridgeId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
  /inventory/transactions/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    delete:
      operationId: deleteInventoryTransactionHistory
      description: Soft-deletes a history entry without reversing the underlying inventory quantity.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
  /inventory/items/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateInventoryItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateItemRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' }, '409': { $ref: '#/components/responses/ConflictError' } }
    delete:
      operationId: deleteInventoryItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /inventory/items/{id}/batches:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: createInventoryBatch
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BatchRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /inventory/batches/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateInventoryBatch
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBatchRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /inventory/batches/{id}/transactions:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: transactInventoryBatch
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/UnprocessableError' } }
  /expiry:
    get:
      operationId: listExpiry
      parameters:
        - { in: query, name: fridgeId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: days, schema: { type: integer, minimum: 0 } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' } }
  /inventory/batches/{id}/assessments:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: listBatchAssessments
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' } }
  /catalog/suggestions:
    get:
      operationId: catalogSuggestions
      parameters:
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 20 } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' } }
  /catalog/weight-estimates:
    get:
      operationId: catalogWeightEstimates
      parameters: [{ in: query, name: catalogId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' } }
  /shopping-lists:
    get:
      operationId: listShoppingLists
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' } }
    post:
      operationId: createShoppingList
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateListRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /shopping-lists/{id}/items:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: createShoppingItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateShoppingItemRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' } }
  /shopping-items/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateShoppingItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateShoppingItemRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' }, '409': { $ref: '#/components/responses/ConflictError' } }
    delete:
      operationId: deleteShoppingItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' } }
  /shopping-items/{id}/store:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: storeShoppingItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /zones/{id}/devices:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: listZoneDevices
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' } }
  /zones/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateZone
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateZoneRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '400': { $ref: '#/components/responses/ValidationError' }, '404': { $ref: '#/components/responses/GenericError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /zones/{id}/sensors:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: listZoneSensorSlots
      description: Returns both PENDING_BIND logical slots and BOUND sensors for the current user's zone.
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
  /devices/{deviceId}/sensors/{sensorId}:
    parameters:
      - { in: path, name: deviceId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: sensorId, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: unbindDeviceSensor
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
  /zones/{id}/readings:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: listZoneReadings
      parameters:
        - { in: query, name: metric, schema: { type: string, enum: [TEMPERATURE, HUMIDITY] } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' } }
  /fridges/{id}/environment:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getFridgeEnvironment
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
  /notifications:
    get:
      operationId: listNotifications
      parameters: [{ in: query, name: unreadOnly, schema: { type: boolean } }]
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '401': { $ref: '#/components/responses/UnauthorizedError' } }
  /notifications/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateNotification
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateNotificationRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /me/preferences:
    get: { operationId: getUserPreferences, responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
    put:
      operationId: updateUserPreferences
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserPreferencesRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /me/notification-preferences:
    get: { operationId: getNotificationPreferences, responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
    put:
      operationId: updateNotificationPreferences
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateNotificationPreferencesRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /inventory/voice-drafts:
    post:
      operationId: createVoiceDraft
      parameters:
        - { in: query, name: fridgeId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
      responses: { '202': { $ref: '#/components/responses/GenericSuccess' }, '400': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/GenericError' } }
  /inventory/voice-drafts/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get: { operationId: getVoiceDraft, responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' } } }
  /inventory/voice-drafts/{id}/confirm:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: confirmVoiceDraft
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmVoiceDraftRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /recipes:
    get:
      operationId: listRecipes
      parameters:
        - { in: query, name: maxCookMinutes, schema: { type: integer } }
        - { in: query, name: taste, schema: { type: string } }
        - { in: query, name: cuisine, schema: { type: string } }
        - { in: query, name: maxCalories, schema: { type: number } }
        - { in: query, name: goal, schema: { type: string } }
        - { in: query, name: availability, schema: { type: string, enum: [DIRECT, MISSING_FEW, UNMATCHED, UNKNOWN] } }
        - { in: query, name: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' } }
  /recipes/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get: { operationId: getRecipe, responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' } } }
  /recipes/generate:
    post:
      operationId: generateRecipes
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenerateRecipeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' } }
  /recipe-synthesis/match:
    post:
      operationId: matchRecipeIngredients
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MatchRecipeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' } }
  /recipes/{id}/scale:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: scaleRecipe
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScaleRecipeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '422': { $ref: '#/components/responses/UnprocessableError' } }
  /recipes/{id}/bookmark:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    put: { operationId: bookmarkRecipe, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
    delete: { operationId: removeRecipeBookmark, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
  /recipes/{id}/cook:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: cookRecipe
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CookRecipeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/UnprocessableError' } }
  /fridges/{fridgeId}/recipe-plans:
    parameters:
      - { in: path, name: fridgeId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listRecipePlans
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
    post:
      operationId: createRecipePlan
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRecipePlanRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
  /recipe-plans/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateRecipePlan
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRecipePlanRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
    delete:
      operationId: deleteRecipePlan
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
  /admin/recipe-sources:
    get: { operationId: listRecipeSources, responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } } }
    post:
      operationId: createRecipeSource
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeSourceRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } }
  /admin/recipe-sources/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateRecipeSource
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeSourceRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } }
  /admin/recipe-import-jobs:
    get:
      operationId: listRecipeImportJobs
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [QUEUED, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } }
    post:
      operationId: createRecipeImportJob
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeImportRequest' } } } }
      responses: { '202': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } }
  /admin/recipe-import-jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get: { operationId: getRecipeImportJob, responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } } }
  /admin/recipe-import-jobs/{id}/retry:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: retryRecipeImportJob
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' }, '404': { $ref: '#/components/responses/GenericError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /admin/search-index:
    get:
      operationId: getRecipeSearchIndexStatus
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } }
  /admin/search-index/rebuild:
    post:
      operationId: rebuildRecipeSearchIndex
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /admin/users:
    get:
      operationId: listAdminUsers
      parameters:
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: role, schema: { type: string, enum: [USER, ADMIN] } }
        - { in: query, name: status, schema: { type: string, enum: [ACTIVE, DISABLED, DELETED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } }
  /admin/users/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get: { operationId: getAdminUser, responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' }, '404': { $ref: '#/components/responses/GenericError' } } }
    delete:
      operationId: deleteAdminUser
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /admin/users/{id}/audit-logs:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: listAdminUserAuditLogs
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } }
  /admin/users/{id}/status:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateAdminUserStatus
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStatusRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /admin/users/{id}/role:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateAdminUserRole
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoleRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' }, '409': { $ref: '#/components/responses/ConflictError' } }
  /admin/users/{id}/sessions/revoke:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post: { operationId: revokeAdminUserSessions, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' } } }
  /admin/users/{id}/password-reset:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: resetAdminUserPassword
      description: 返回一次性临时密码；服务端仅保存 Argon2id 哈希，密码 24 小时过期并强制修改。
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: 临时密码，仅本响应显示一次
          content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryPasswordEnvelope' } } }
        '403': { $ref: '#/components/responses/GenericError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /admin/users/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post: { operationId: restoreAdminUser, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '403': { $ref: '#/components/responses/GenericError' }, '409': { $ref: '#/components/responses/ConflictError' } } }
  /meals/estimate-nutrition:
    post:
      operationId: estimateMealNutrition
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EstimateNutritionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' } }
  /meals:
    get: { operationId: listMeals, responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
    post:
      operationId: createMeal
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMealRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' } }
  /meals/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    delete:
      operationId: deleteMeal
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/EmptySuccess' }, '404': { $ref: '#/components/responses/GenericError' } }
  /analytics/consumption:
    get: { operationId: getConsumptionAnalytics, parameters: [{ in: query, name: period, schema: { type: string, enum: [week, month] } }], responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
  /analytics/diet:
    get: { operationId: getDietAnalytics, parameters: [{ in: query, name: date, schema: { type: string, format: date } }], responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
  /assistant/briefing:
    get: { operationId: getAssistantBriefing, responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
  /assistant/conversations:
    post:
      operationId: createAssistantConversation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAssistantConversationRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' } }
  /assistant/conversations/{conversationId}/messages:
    parameters: [{ in: path, name: conversationId, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: sendAssistantMessage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantMessageRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '409': { $ref: '#/components/responses/ConflictError' }, '422': { $ref: '#/components/responses/UnprocessableError' } }
  /assistant/action-proposals/{id}/confirm:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post: { operationId: confirmAssistantAction, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { $ref: '#/components/responses/GenericSuccess' }, '409': { $ref: '#/components/responses/ConflictError' } } }
  /assistant/action-proposals/{id}/dismiss:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post: { operationId: dismissAssistantAction, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { $ref: '#/components/responses/GenericSuccess' } } }
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ResourceId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    GenericError:
      description: 请求失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    GenericSuccess:
      description: 成功响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    EmptySuccess:
      description: 成功响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmptyEnvelope' }
    UnprocessableError:
      description: 单位无法转换或业务规则无法执行
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SessionResponse:
      description: 已认证会话。响应同时设置 HttpOnly 刷新 Cookie。
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionEnvelope' }
    ValidationError:
      description: 请求字段校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnauthorizedError:
      description: 身份凭据无效或过期
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ConflictError:
      description: 资源状态冲突或幂等键复用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimitedError:
      description: 请求频率超限
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Envelope:
      type: object
      required: [code, message, data, traceId]
      properties:
        code: { type: string, example: OK }
        message: { type: string }
        data: {}
        traceId: { type: string }
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                fields:
                  type: object
                  additionalProperties: { type: string }
    EmptyEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { type: 'null' }
    RegisterRequest:
      type: object
      required: [username, email, password, displayName]
      properties:
        username: { type: string, pattern: '^[a-z0-9_]{3,32}$', minLength: 3, maxLength: 32 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 80 }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 320, description: Email address or username }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    UpdateProfileRequest:
      type: object
      required: [username, displayName, timezone, temperatureUnit]
      properties:
        username: { type: string, pattern: '^[a-z0-9_]{3,32}$', minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string, example: Asia/Shanghai }
        temperatureUnit: { type: string, enum: [C, F] }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        newPassword: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    User:
      type: object
      required: [id, username, email, displayName, timezone, temperatureUnit, role, status, passwordChangeRequired]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, pattern: '^[a-z0-9_]{3,32}$' }
        email: { type: string, format: email }
        displayName: { type: string }
        timezone: { type: string }
        temperatureUnit: { type: string, enum: [C, F] }
        role: { type: string, enum: [USER, ADMIN] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        passwordChangeRequired: { type: boolean }
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/User' }
    Session:
      type: object
      required: [accessToken, accessTokenExpiresAt, user, onboardingRequired]
      properties:
        accessToken: { type: string, writeOnly: true }
        accessTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        onboardingRequired: { type: boolean }
    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Session' }
    ZoneKind:
      type: string
      enum: [CHILL, FRESH, VARIABLE, FREEZE]
    ZoneRequest:
      type: object
      required: [kind, name, temperatureSensorCount, humiditySensorCount]
      properties:
        kind: { $ref: '#/components/schemas/ZoneKind' }
        name: { type: string, minLength: 1, maxLength: 48 }
        temperatureSensorCount: { type: integer, minimum: 0, maximum: 4 }
        humiditySensorCount: { type: integer, minimum: 0, maximum: 4 }
    InitializeRequest:
      type: object
      required: [fridgeName, zones]
      properties:
        fridgeName: { type: string, minLength: 1, maxLength: 80 }
        zones:
          type: array
          minItems: 3
          maxItems: 6
          items: { $ref: '#/components/schemas/ZoneRequest' }
    ZoneDefault:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/ZoneKind' }
        suggestedName: { type: string }
        targetTemperatureC: { type: number }
        targetHumidityPct: { type: number }
        safeTemperatureMinC: { type: number }
        safeTemperatureMaxC: { type: number }
        safeHumidityMinPct: { type: number }
        safeHumidityMaxPct: { type: number }
    ZoneSummary:
      type: object
      required: [id, kind, name, enabled, targetTemperatureC, targetHumidityPct, temperatureSensorCount, humiditySensorCount, sensorBindingStatus]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ZoneKind' }
        name: { type: string }
        enabled: { type: boolean }
        targetTemperatureC: { type: number }
        targetHumidityPct: { type: number }
        safeTemperatureMinC: { type: number }
        safeTemperatureMaxC: { type: number }
        safeHumidityMinPct: { type: number }
        safeHumidityMaxPct: { type: number }
        temperatureSensorCount: { type: integer }
        humiditySensorCount: { type: integer }
        sensorBindingStatus: { type: string, enum: [PENDING_BIND, NOT_CONNECTED] }
    FridgeSummary:
      type: object
      required: [id, name, zones]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        zones:
          type: array
          items: { $ref: '#/components/schemas/ZoneSummary' }
    FridgeEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/FridgeSummary' }
    OnboardingStatus:
      type: object
      required: [completed, minimumZones, maximumZones, maximumSensorsPerMetric, zoneDefaults]
      properties:
        completed: { type: boolean }
        minimumZones: { type: integer, const: 3 }
        maximumZones: { type: integer, const: 6 }
        maximumSensorsPerMetric: { type: integer, const: 4 }
        zoneDefaults:
          type: array
          items: { $ref: '#/components/schemas/ZoneDefault' }
        fridge:
          oneOf:
            - $ref: '#/components/schemas/FridgeSummary'
            - type: 'null'
    OnboardingStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/OnboardingStatus' }
    FoodCategory:
      type: string
      enum: [VEGETABLE, FRUIT, MEAT_EGG, SEAFOOD, DAIRY, BEAN, SNACK, BEVERAGE, CONDIMENT, OTHER]
    CreateItemRequest:
      type: object
      required: [fridgeId, name, defaultUnit, batches]
      properties:
        fridgeId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { $ref: '#/components/schemas/FoodCategory' }
        lowStockQuantity: { type: number, minimum: 0 }
        defaultUnit: { type: string, maxLength: 24 }
        batches: { type: array, minItems: 1, items: { $ref: '#/components/schemas/BatchRequest' } }
    BatchRequest:
      type: object
      required: [quantity, unit]
      properties:
        zoneId: { type: string, format: uuid, nullable: true }
        storedAt: { type: string, format: date-time }
        openedAt: { type: string, format: date-time, nullable: true }
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 24 }
        remindAt: { type: string, format: date-time, nullable: true }
    UpdateItemRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        category: { $ref: '#/components/schemas/FoodCategory' }
        lowStockQuantity: { type: number, minimum: 0 }
        defaultUnit: { type: string, maxLength: 24 }
    UpdateBatchRequest:
      type: object
      properties:
        zoneId: { type: string, format: uuid, nullable: true }
        openedAt: { type: string, format: date-time, nullable: true }
        remindAt: { type: string, format: date-time, nullable: true }
    UpdateZoneRequest:
      type: object
      required: [name, targetTemperatureC, targetHumidityPct]
      properties:
        name: { type: string, minLength: 1, maxLength: 48 }
        targetTemperatureC: { type: number, minimum: -40, maximum: 40 }
        targetHumidityPct: { type: number, minimum: 0, maximum: 100 }
    TransactionRequest:
      type: object
      required: [type, quantity]
      properties:
        type: { type: string, enum: [ADJUST, CONSUME, EXPIRED, DISCARD] }
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 24 }
        reason: { type: string, maxLength: 255 }
    CreateListRequest:
      type: object
      required: [name]
      properties:
        fridgeId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
    CreateShoppingItemRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, maxLength: 24 }
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 24 }
        note: { type: string, maxLength: 255 }
        sourceType: { type: string, maxLength: 32 }
    UpdateShoppingItemRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        category: { type: string, maxLength: 24 }
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 24 }
        note: { type: string, maxLength: 255 }
        status: { type: string, enum: [PENDING, PURCHASED, STORED] }
    StoreRequest:
      type: object
      properties:
        fridgeId: { type: string, format: uuid }
        zoneId: { type: string, format: uuid, nullable: true }
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 24 }
        storedAt: { type: string, format: date-time }
    UpdateNotificationRequest:
      type: object
      properties:
        read: { type: boolean }
        dismissed: { type: boolean }
    UpdateUserPreferencesRequest:
      type: object
      properties:
        tastes: { type: array, items: { type: string } }
        cuisines: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        dislikes: { type: array, items: { type: string } }
        dietaryGoal: { type: string }
        calorieTarget: { type: integer, minimum: 500, maximum: 10000 }
        temperatureUnit: { type: string, enum: [C, F] }
    UpdateNotificationPreferencesRequest:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            type: object
            required: [type, inAppEnabled, emailEnabled]
            properties:
              type: { type: string, enum: [EXPIRY_SOON, EXPIRED, LOW_STOCK, ENVIRONMENT_ALERT] }
              inAppEnabled: { type: boolean }
              emailEnabled:
                type: boolean
                deprecated: true
                description: 已弃用；服务端固定返回并保存为 false，仅支持站内通知。
              quietStart: { type: string, format: time }
              quietEnd: { type: string, format: time }
              timezone: { type: string }
    ConfirmVoiceDraftRequest:
      type: object
      required: [inventory]
      properties:
        inventory: { $ref: '#/components/schemas/CreateItemRequest' }
    RecipeIngredientInput:
      type: object
      required: [name]
      properties:
        batchId: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: number }
        unit: { type: string }
    GenerateRecipeRequest:
      type: object
      properties:
        fridgeId: { type: string, format: uuid }
        prompt: { type: string, maxLength: 500 }
        inventory: { type: array, items: { $ref: '#/components/schemas/RecipeIngredientInput' } }
        count: { type: integer, minimum: 1, maximum: 3 }
    MatchRecipeRequest:
      type: object
      required: [ingredients]
      properties:
        ingredients: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/RecipeIngredientInput' } }
    ScaleRecipeRequest:
      type: object
      required: [primaryComponentId, quantity, unit, servings]
      properties:
        primaryComponentId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string }
        servings: { type: number, exclusiveMinimum: 0 }
    CookRecipeRequest:
      type: object
      required: [servings, consumptions]
      properties:
        servings: { type: number, exclusiveMinimum: 0 }
        consumptions:
          type: array
          items:
            type: object
            required: [batchId, quantity, unit]
            properties:
              batchId: { type: string, format: uuid }
              quantity: { type: number, exclusiveMinimum: 0 }
              unit: { type: string }
        recordMeal: { type: boolean }
        mealAt: { type: string, format: date-time }
        synthesisId: { type: string, format: uuid, description: Backend synthesis session to execute atomically with cooking. }
    CreateRecipePlanRequest:
      type: object
      required: [recipeId, servings]
      properties:
        recipeId: { type: string, format: uuid }
        servings: { type: number, minimum: 0.1 }
    UpdateRecipePlanRequest:
      type: object
      required: [servings]
      properties:
        servings: { type: number, minimum: 0.1 }
    EstimateNutritionRequest:
      type: object
      required: [dishName]
      properties:
        dishName: { type: string }
        amount: { type: number }
        unit: { type: string }
    CreateMealRequest:
      type: object
      required: [mealAt, name, servings]
      properties:
        recipeId: { type: string, format: uuid }
        mealAt: { type: string, format: date-time }
        mealType: { type: string, maxLength: 24 }
        name: { type: string, maxLength: 160 }
        servings: { type: number, minimum: 0.1 }
        calories: { type: number }
        protein: { type: number }
        fat: { type: number }
        carbs: { type: number }
        estimated: { type: boolean }
        nutritionSource: { type: string }
    RecipeSourceRequest:
      type: object
      required: [name, sourceType, licenseCode, attributionText, allowedUse, sourceVersion]
      properties:
        name: { type: string, maxLength: 160 }
        sourceType: { type: string }
        licenseCode: { type: string }
        attributionText: { type: string, maxLength: 500 }
        allowedUse: { type: string }
        sourceVersion: { type: string }
        enabled: { type: boolean }
    RecipeImportRequest:
      type: object
      required: [sourceId, payload]
      properties:
        sourceId: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
    AdminStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
    AdminRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [USER, ADMIN] }
    TemporaryPassword:
      type: object
      required: [userId, temporaryPassword, expiresAt]
      properties:
        userId: { type: string, format: uuid }

spring:
  application:
    name: xianzhi-fridge
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xianzhi?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${MYSQL_USER:xianzhi}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  identity:
    tombstone-key: ${IDENTITY_TOMBSTONE_KEY:replace-with-a-development-tombstone-key}
    deletion-retention: ${IDENTITY_DELETION_RETENTION:P90D}
  telemetry:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    public-broker-url: ${MQTT_PUBLIC_BROKER_URL:tcp://localhost:1883}
    service-username: ${MQTT_SERVICE_USERNAME:service}
    service-password: ${MQTT_SERVICE_PASSWORD:change-me}
    simulator-username: ${MQTT_SIMULATOR_USERNAME:simulator}
    simulator-password: ${MQTT_SIMULATOR_PASSWORD:change-me-simulator}
    internal-token: ${MQTT_INTERNAL_TOKEN:replace-with-an-internal-development-token}
    debug-test-operator-usernames: ${DEBUG_TEST_OPERATOR_USERNAMES:}
    emit-interval: ${MQTT_SIMULATOR_EMIT_INTERVAL:PT1M}
    enabled: ${MQTT_ENABLED:false}
  security:
    jwt-issuer: ${JWT_ISSUER:xianzhi-api}
    jwt-signing-key: ${JWT_SIGNING_KEY:replace-with-a-development-secret-at-least-32-bytes}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
    refresh-cookie-name: xianzhi_refresh
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    admin-usernames: ${ADMIN_USERNAMES:}
  rate-limit:
    login-per-ip-per-minute: 5
    login-per-account-per-15-minutes: 10
  speech:
    provider: ${SPEECH_PROVIDER:disabled}
    fake-enabled: ${SPEECH_FAKE_ENABLED:false}
    fake-transcript: ${SPEECH_FAKE_TRANSCRIPT:鸡蛋 2 个}
    storage-path: ${SPEECH_STORAGE_PATH:${java.io.tmpdir}/xianzhi-speech}
    max-upload-bytes: ${SPEECH_MAX_UPLOAD_BYTES:10485760}
    base-url: ${SPEECH_BASE_URL:}
    api-key: ${SPEECH_API_KEY:}
    model: ${SPEECH_MODEL:whisper-1}
    language: ${SPEECH_LANGUAGE:zh}
    timeout: ${SPEECH_TIMEOUT:PT60S}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:xianzhi-speech}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style: ${STORAGE_PATH_STYLE:true}
    server-side-encryption: ${STORAGE_SERVER_SIDE_ENCRYPTION:true}
    lifecycle-days: ${STORAGE_LIFECYCLE_DAYS:2}
    manage-lifecycle: ${STORAGE_MANAGE_LIFECYCLE:true}
  ai:
    external-calls-enabled: ${AI_EXTERNAL_CALLS_ENABLED:false}
    model-name: ${AI_MODEL_NAME:rules-v1}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    timeout: ${AI_TIMEOUT:PT30S}
    vector-enabled: ${AI_VECTOR_ENABLED:false}
    embedding-provider: ${EMBEDDING_PROVIDER:local}
    embedding-base-url: ${EMBEDDING_BASE_URL:}
    embedding-api-key: ${EMBEDDING_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1536}
    qdrant-url: ${QDRANT_URL:http://localhost:6333}
    qdrant-collection: ${QDRANT_COLLECTION:xianzhi_recipes}
    qdrant-api-key: ${QDRANT_API_KEY:}

logging:
  structured:
    format:
      console: logstash

spring:
  application:
    name: xianzhi-fridge
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xianzhi?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${MYSQL_USER:xianzhi}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
  security:
    jwt-issuer: ${JWT_ISSUER:xianzhi-api}
    jwt-signing-key: ${JWT_SIGNING_KEY:replace-with-a-development-secret-at-least-32-bytes}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
    refresh-cookie-name: xianzhi_refresh
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  rate-limit:
    login-per-ip-per-minute: 5
    login-per-account-per-15-minutes: 10

logging:
  structured:
    format:
      console: logstash

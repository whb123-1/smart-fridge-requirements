services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xianzhi}
      MYSQL_USER: ${MYSQL_USER:-xianzhi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      TZ: UTC
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: emqx/emqx:5.8.8
    hostname: emqx
    environment:
      EMQX_NODE__NAME: emqx@emqx
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:-replace-with-a-development-erlang-cookie}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-change-me-emqx}
      EMQX_AUTHENTICATION__1__HEADERS: >-
        {"content-type"="application/json","x-internal-key"="${MQTT_INTERNAL_TOKEN:-replace-with-an-internal-development-token}"}
      EMQX_AUTHORIZATION__SOURCES__1__HEADERS: >-
        {"content-type"="application/json","x-internal-key"="${MQTT_INTERNAL_TOKEN:-replace-with-an-internal-development-token}"}
    volumes:
      - ./infra/emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:18083/status | grep --quiet 'is running'"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xianzhi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    profiles: ["vector"]
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: api,dev
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/xianzhi?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
      MYSQL_USER: ${MYSQL_USER:-xianzhi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      REDIS_HOST: ${REDIS_HOST:-redis}
      JWT_ISSUER: ${JWT_ISSUER:-xianzhi-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P30D}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-replace-with-a-32-byte-minimum-development-secret}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_SERVICE_USERNAME: ${MQTT_SERVICE_USERNAME:-service}
      MQTT_SERVICE_PASSWORD: ${MQTT_SERVICE_PASSWORD:-change-me-service}
      MQTT_INTERNAL_TOKEN: ${MQTT_INTERNAL_TOKEN:-replace-with-an-internal-development-token}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-demo}
      VIRTUAL_TELEMETRY_ENABLED: ${VIRTUAL_TELEMETRY_ENABLED:-true}
      MQTT_SIMULATOR_EMIT_INTERVAL: ${MQTT_SIMULATOR_EMIT_INTERVAL:-PT5S}
      ENVIRONMENT_AGGREGATION_INTERVAL: ${ENVIRONMENT_AGGREGATION_INTERVAL:-PT5S}
      SPEECH_FAKE_ENABLED: ${SPEECH_FAKE_ENABLED:-true}
      SPEECH_FAKE_TRANSCRIPT: ${SPEECH_FAKE_TRANSCRIPT:-鸡蛋 2 个}
      SPEECH_STORAGE_PATH: /data/speech
      AI_EXTERNAL_CALLS_ENABLED: ${AI_EXTERNAL_CALLS_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-chat}
      AI_VECTOR_ENABLED: ${AI_VECTOR_ENABLED:-false}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-xianzhi_recipes}
    volumes:
      - speech_data:/data/speech
    secrets:
      - deepseek_api_key
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: worker,dev
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/xianzhi?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
      MYSQL_USER: ${MYSQL_USER:-xianzhi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      REDIS_HOST: ${REDIS_HOST:-redis}
      JWT_ISSUER: ${JWT_ISSUER:-xianzhi-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P30D}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-replace-with-a-32-byte-minimum-development-secret}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_SERVICE_USERNAME: ${MQTT_SERVICE_USERNAME:-service}
      MQTT_SERVICE_PASSWORD: ${MQTT_SERVICE_PASSWORD:-change-me-service}
      MQTT_INTERNAL_TOKEN: ${MQTT_INTERNAL_TOKEN:-replace-with-an-internal-development-token}
      VIRTUAL_TELEMETRY_ENABLED: ${VIRTUAL_TELEMETRY_ENABLED:-true}
      MQTT_SIMULATOR_EMIT_INTERVAL: ${MQTT_SIMULATOR_EMIT_INTERVAL:-PT5S}
      ENVIRONMENT_AGGREGATION_INTERVAL: ${ENVIRONMENT_AGGREGATION_INTERVAL:-PT5S}
      SPEECH_FAKE_ENABLED: ${SPEECH_FAKE_ENABLED:-true}
      SPEECH_FAKE_TRANSCRIPT: ${SPEECH_FAKE_TRANSCRIPT:-鸡蛋 2 个}
      SPEECH_STORAGE_PATH: /data/speech
      AI_EXTERNAL_CALLS_ENABLED: ${AI_EXTERNAL_CALLS_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-chat}
      AI_VECTOR_ENABLED: ${AI_VECTOR_ENABLED:-false}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-xianzhi_recipes}
    volumes:
      - speech_data:/data/speech
    secrets:
      - deepseek_api_key
    depends_on:
      api:
        condition: service_healthy
      emqx:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  emqx_data:
  emqx_log:
  speech_data:
  minio_data:
  qdrant_data:

secrets:
  deepseek_api_key:
    file: ./secrets/deepseek_api_key

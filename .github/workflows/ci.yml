name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend tests, Flyway and OpenAPI contract
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload core coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco
      - name: Frontend tests and production build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Administrator browser journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Validate production Compose
        run: docker compose --env-file .env.prod.example -f compose.prod.yaml -f compose.monitoring.yaml -f compose.backup.yaml config --quiet
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  images:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
          - name: backup
            context: infra/backup
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xianzhi-${{ matrix.name }}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: '${{ matrix.context }}'
          push: true
          tags: '${{ steps.image.outputs.ref }}'
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with: { image: '${{ steps.image.outputs.ref }}', format: spdx-json, output-file: 'sbom-${{ matrix.name }}.spdx.json' }
      - uses: actions/upload-artifact@v4
        with: { name: 'sbom-${{ matrix.name }}', path: 'sbom-${{ matrix.name }}.spdx.json' }
      - name: Scan image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: '${{ steps.image.outputs.ref }}'
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign immutable image
        run: cosign sign --yes '${{ steps.image.outputs.ref }}'
